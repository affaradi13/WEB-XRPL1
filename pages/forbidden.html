<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden — Caprice 26</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="cyber-grid-overlay"></div>
  <div class="custom-cursor-dot"></div>
  <div class="custom-cursor-ring"></div>

  <main class="auth-main">
    <div class="auth-shell">
      <section class="auth-form-panel" style="width:100%;">
        <div class="auth-card auth-status-card">
          <span class="auth-status-icon">🚫</span>
          <span class="section-badge">403 Forbidden</span>
          <h1 class="auth-heading">Anda tidak memiliki akses</h1>
          <div id="forbidden-role-info" class="auth-status-info"></div>
          <p class="auth-sub">Anda berhasil masuk, tetapi tidak memiliki izin untuk membuka halaman ini.</p>
          <button class="btn btn-primary auth-submit" id="forbidden-back">Kembali ke Dashboard</button>
          <button class="btn btn-outline auth-secondary-btn" id="forbidden-logout">Keluar</button>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/middleware.js"></script>
  <script>
    "use strict";
    (function () {
      const auth = window.CapriceAuth;
      const middleware = window.CapriceMiddleware;
      const user = auth.getUser();
      const info = document.getElementById("forbidden-role-info");
      if (info && user) {
        const role = window.CAPRICE_CONFIG.ROLES[user.role];
        info.textContent = "Role Anda: " + (role ? role.label : user.role);
      }
      document.getElementById("forbidden-back").addEventListener("click", () => {
        if (user && middleware.defaultDashboardFor(user.role)) {
          window.location.href = middleware.defaultDashboardFor(user.role);
        } else {
          window.location.href = "index.html";
        }
      });
      document.getElementById("forbidden-logout").addEventListener("click", () => {
        auth.logout();
        window.location.href = "login.html";
      });
    })();
  </script>
  <script src="../main.js"></script>
</body>
</html>
