<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Ditolak — Caprice 26</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="cyber-grid-overlay"></div>
  <div class="custom-cursor-dot"></div>
  <div class="custom-cursor-ring"></div>

  <main class="auth-main">
    <div class="auth-shell">
      <section class="auth-form-panel" style="width:100%;">
        <div class="auth-card auth-status-card">
          <span class="auth-status-icon">🚫</span>
          <span class="section-badge">Akses Ditolak</span>
          <h1 class="auth-heading">Role tidak dikenali</h1>
          <p class="auth-sub">Peran akun Anda tidak dikenali sistem. Silakan hubungi administrator.</p>
          <button class="btn btn-primary auth-submit" id="unauth-home">Kembali ke Beranda</button>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById("unauth-home").addEventListener("click", () => {
      window.CapriceAuth.logout();
      window.location.href = "index.html";
    });
  </script>
  <script src="../main.js"></script>
</body>
</html>
